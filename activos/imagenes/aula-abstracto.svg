<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064E3B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#022C22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Escritorios / pupitres abstractos -->
  <rect x="40" y="180" width="80" height="50" rx="6" fill="url(#desk)" stroke="#10B981" stroke-width="1" opacity="0.6"/>
  <rect x="160" y="180" width="80" height="50" rx="6" fill="url(#desk)" stroke="#10B981" stroke-width="1" opacity="0.6"/>
  <rect x="280" y="180" width="80" height="50" rx="6" fill="url(#desk)" stroke="#10B981" stroke-width="1" opacity="0.6"/>
  <rect x="100" y="240" width="80" height="50" rx="6" fill="url(#desk)" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <rect x="220" y="240" width="80" height="50" rx="6" fill="url(#desk)" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <!-- Pizarrón -->
  <rect x="120" y="30" width="160" height="100" rx="8" fill="#0D3829" stroke="#10B981" stroke-width="2"/>
  <line x1="140" y1="55" x2="260" y2="55" stroke="#4ADE80" stroke-width="2" opacity="0.5"/>
  <line x1="140" y1="75" x2="240" y2="75" stroke="#4ADE80" stroke-width="2" opacity="0.3"/>
  <line x1="140" y1="95" x2="220" y2="95" stroke="#4ADE80" stroke-width="2" opacity="0.2"/>
  <!-- Figuras de estudiantes (círculos abstractos) -->
  <circle cx="80" cy="165" r="12" fill="#10B981" opacity="0.5"/>
  <circle cx="200" cy="165" r="12" fill="#22C55E" opacity="0.5"/>
  <circle cx="320" cy="165" r="12" fill="#10B981" opacity="0.5"/>
  <circle cx="140" cy="225" r="12" fill="#22C55E" opacity="0.3"/>
  <circle cx="260" cy="225" r="12" fill="#10B981" opacity="0.3"/>
  <!-- Decoración sutil -->
  <circle cx="350" cy="40" r="30" fill="#10B981" opacity="0.05"/>
  <circle cx="50" cy="60" r="20" fill="#22C55E" opacity="0.05"/>
</svg>
