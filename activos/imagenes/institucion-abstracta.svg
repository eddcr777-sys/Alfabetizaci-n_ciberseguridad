<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg_inst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#064E3B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#064E3B" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Fondo suave -->
  <rect width="500" height="400" fill="url(#bg_inst)" rx="24"/>
  
  <!-- Círculos decorativos de fondo -->
  <circle cx="400" cy="100" r="150" fill="#ffffff" opacity="0.4" />
  <circle cx="100" cy="300" r="80" fill="#10B981" opacity="0.1" />

  <!-- Edificio principal central (Liceo) -->
  <path d="M150 300 L150 150 L250 100 L350 150 L350 300 Z" fill="url(#building)" filter="url(#shadow)"/>
  
  <!-- Alas del edificio -->
  <rect x="80" y="200" width="70" height="100" fill="#0D3829" opacity="0.8" />
  <rect x="350" y="200" width="70" height="100" fill="#0D3829" opacity="0.8" />

  <!-- Detalles de ventanas (tecnológicas/abstractas) -->
  <!-- Ala izquierda -->
  <rect x="100" y="220" width="12" height="20" rx="3" fill="#4ADE80" opacity="0.8"/>
  <rect x="120" y="220" width="12" height="20" rx="3" fill="#4ADE80" opacity="0.8"/>
  <rect x="100" y="250" width="12" height="20" rx="3" fill="#4ADE80" opacity="0.8"/>
  <rect x="120" y="250" width="12" height="20" rx="3" fill="#4ADE80" opacity="0.8"/>

  <!-- Ala derecha -->
  <rect x="368" y="220" width="12" height="20" rx="3" fill="#4ADE80" opacity="0.8"/>
  <rect x="388" y="220" width="12" height="20" rx="3" fill="#4ADE80" opacity="0.8"/>
  <rect x="368" y="250" width="12" height="20" rx="3" fill="#4ADE80" opacity="0.8"/>
  <rect x="388" y="250" width="12" height="20" rx="3" fill="#4ADE80" opacity="0.8"/>

  <!-- Centro -->
  <rect x="225" y="160" width="50" height="30" rx="6" fill="#f0fdf4" opacity="0.9"/>
  <rect x="225" y="200" width="50" height="30" rx="6" fill="#f0fdf4" opacity="0.9"/>
  
  <!-- Puerta principal -->
  <path d="M230 300 L230 250 A 20 20 0 0 1 270 250 L270 300 Z" fill="#d1fae5"/>

  <!-- Conexiones tecnológicas (Nodos de red) saliendo del techo -->
  <path d="M250 100 L250 50" stroke="#10B981" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="250" cy="50" r="6" fill="#22C55E"/>
  
  <path d="M250 100 L180 60" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="180" cy="60" r="4" fill="#4ADE80"/>

  <path d="M250 100 L320 60" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="320" cy="60" r="4" fill="#4ADE80"/>

  <!-- Árboles (Arboreto) abstracto -->
  <circle cx="60" cy="280" r="25" fill="#22C55E" opacity="0.7"/>
  <circle cx="85" cy="290" r="20" fill="#10B981" opacity="0.8"/>
  
  <circle cx="440" cy="280" r="25" fill="#22C55E" opacity="0.7"/>
  <circle cx="415" cy="290" r="20" fill="#10B981" opacity="0.8"/>

  <!-- Piso / Base -->
  <rect x="0" y="300" width="500" height="100" fill="#ffffff" opacity="0.5"/>
  <line x1="0" y1="300" x2="500" y2="300" stroke="#10B981" stroke-width="2" opacity="0.3"/>
</svg>
