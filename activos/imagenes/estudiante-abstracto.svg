<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064E3B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect width="400" height="300" fill="url(#bg2)" rx="16"/>
  <!-- Silueta de estudiante con laptop -->
  <circle cx="200" cy="100" r="35" fill="#ffffff" opacity="0.15"/>
  <rect x="155" y="145" width="90" height="5" rx="2.5" fill="#ffffff" opacity="0.1"/>
  <!-- Laptop -->
  <rect x="160" y="165" width="80" height="50" rx="4" fill="#0D3829" stroke="#4ADE80" stroke-width="1.5"/>
  <!-- Pantalla con código -->
  <line x1="170" y1="178" x2="210" y2="178" stroke="#4ADE80" stroke-width="1.5" opacity="0.6"/>
  <line x1="170" y1="188" x2="225" y2="188" stroke="#22C55E" stroke-width="1.5" opacity="0.4"/>
  <line x1="170" y1="198" x2="200" y2="198" stroke="#4ADE80" stroke-width="1.5" opacity="0.3"/>
  <!-- Base de laptop -->
  <rect x="150" y="215" width="100" height="8" rx="2" fill="#0D3829" stroke="#4ADE80" stroke-width="1"/>
  <!-- Escudo de seguridad -->
  <path d="M320 60 L340 50 L360 60 L360 90 C360 105 340 115 340 115 C340 115 320 105 320 90 Z" 
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  <path d="M335 80 L340 85 L350 72" stroke="#4ADE80" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Partículas decorativas -->
  <circle cx="60" cy="50" r="3" fill="#ffffff" opacity="0.1"/>
  <circle cx="90" cy="240" r="4" fill="#4ADE80" opacity="0.1"/>
  <circle cx="350" cy="250" r="5" fill="#ffffff" opacity="0.08"/>
  <circle cx="40" cy="180" r="2" fill="#22C55E" opacity="0.15"/>
</svg>
